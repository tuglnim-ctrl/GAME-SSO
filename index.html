<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>폭탄 대포</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020}
canvas{display:block;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = "'Black Han Sans','Arial Black','Malgun Gothic',sans-serif";
const G = 900;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const easeOutElastic = k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * 2 * Math.PI / 3) + 1;
const easeInBack = k => 2.7 * k * k * k - 1.7 * k * k;
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A[0] + (B[0] - A[0]) * k | 0},${A[1] + (B[1] - A[1]) * k | 0},${A[2] + (B[2] - A[2]) * k | 0})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }

// ---------------- 화면 ----------------
let W, H, DPR, GY, sScale = 1, spdScale = 1;
let mtn1 = [], mtn2 = [], clouds = [], stars = [], slots = [];
const cannon = { x: 100, y: 0, ang: -0.75, recoil: 0, charge: 0, charging: false, wheel: 0, squash: 0 };

function genLayer(n, amp, seed) {
  const p = [];
  for (let i = 0; i <= n; i++) p.push(amp * (0.45 + 0.55 * Math.abs(Math.sin(i * 0.9 + seed) * Math.cos(i * 0.37 + seed * 2))));
  return p;
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  GY = Math.round(H * 0.82);
  sScale = Math.sqrt(clamp(W / 1400, 0.42, 1.3));
  spdScale = clamp(W / 1400, 0.6, 1.2);
  cannon.x = Math.max(90, W * 0.08); cannon.y = GY;
  mtn1 = genLayer(14, H * 0.28, 1.3); mtn2 = genLayer(22, H * 0.17, 4.1);
  if (!clouds.length) for (let i = 0; i < 9; i++) clouds.push({ x: rand(0, 1), y: rand(0.05, 0.4), s: rand(0.6, 1.5), v: rand(0.004, 0.015) });
  if (!stars.length) for (let i = 0; i < 120; i++) stars.push({ x: rand(0, 1), y: rand(0, 0.6), s: rand(0.5, 1.8), p: rand(0, 6) });
  layoutSlots();
}
function layoutSlots() {
  const sw = 78, sh = 64, gap = 12, total = sw * 3 + gap * 2;
  slots = [0, 1, 2].map(i => ({ x: W / 2 - total / 2 + i * (sw + gap), y: H - sh - 14, w: sw, h: sh }));
}
addEventListener('resize', resize);

// ---------------- 오디오 ----------------
let AC = null, master, noiseBuf, lastBoom = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function sfxNoise(dur, f0, f1, vol) {
  if (!AC) return; const t0 = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur);
}
function sfxTone(f0, f1, dur, type, vol) {
  if (!AC) return; const t0 = AC.currentTime;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur);
}
function sfxBoom(r) {
  if (!AC || AC.currentTime - lastBoom < 0.035) return; lastBoom = AC.currentTime;
  const k = clamp(r / 170, 0.25, 1.4);
  sfxNoise(0.4 + k * 0.9, 2500, 60, 0.5 + k * 0.4);
  sfxTone(140, 28, 0.3 + k * 0.6, 'sine', 0.6 + k * 0.3);
}
const sfxFire = (k) => { sfxNoise(0.35, 3000, 100, 0.35); sfxTone(220, 45, 0.25, 'triangle', 0.5 + k * 0.2); };
const sfxPop = () => { sfxTone(500, 1400, 0.12, 'square', 0.12); sfxTone(900, 1800, 0.18, 'sine', 0.15); };
const sfxClick = () => sfxTone(700, 900, 0.06, 'square', 0.08);
const sfxHurt = () => { sfxTone(300, 60, 0.4, 'sawtooth', 0.25); };

// ---------------- 게임 데이터 ----------------
const WEAP = [
  { name: '일반탄', r: 78, dmg: 2.2, size: 10, col: '#2b2b33', key: '1' },
  { name: '클러스터', r: 62, dmg: 1.6, size: 11, col: '#2f9e5a', key: '2' },
  { name: '메가폭탄', r: 175, dmg: 9, size: 17, col: '#c62828', key: '3' },
];
const ED = {
  soldier: { w: 22, h: 36, sp: 72, hp: 1, sc: 100, dmg: 8 },
  tank: { w: 72, h: 40, sp: 34, hp: 5, sc: 300, dmg: 15, fire: 4.2 },
  drone: { w: 44, h: 22, sp: 96, hp: 1, sc: 200, dmg: 10, fly: 1 },
  boss: { w: 140, h: 160, sp: 16, hp: 45, sc: 5000, dmg: 50, fire: 2.3 },
};
const PAL = [
  { t: '#3d8bff', b: '#c4ecff', sun: '#fff6c0', sy: 0.2 },
  { t: '#ff7a59', b: '#ffd9a0', sun: '#fff0c8', sy: 0.42 },
  { t: '#2e1f5e', b: '#ea6c8c', sun: '#ffd0a0', sy: 0.55 },
  { t: '#060a20', b: '#2a3270', sun: '#eef2ff', sy: 0.16 },
];

let state = 'title', t = 0, score = 0, shownScore = 0, scoreBump = 0, best = 0;
let hp = 100, hpLag = 100, hpShake = 0, wave = 0, combo = 0, comboT = 0, bestCombo = 0, kills = 0;
let enemies = [], bombs = [], parts = [], rings = [], texts = [], decals = [], crates = [], shells = [], flashes = [], timers = [];
let shake = 0, punch = 0, hitstop = 0, slowT = 0, timeScale = 1, flash = 0, redFlash = 0;
let weapon = 0, ammo = [Infinity, 3, 1], slotBump = [0, 0, 0], slotDeny = [0, 0, 0];
let spawnList = [], spawnT = 0, waveState = 'banner', bannerT = 0, crateT = 8, overT = 0, demoT = 0, demoSpawn = 0;
let palFrom = 0, palTo = 0, palK = 1;
const mouse = { x: 600, y: 300 };
try { best = +localStorage.getItem('cannonBest') || 0; } catch (e) { }

// ---------------- 파티클 ----------------
function addP(o) {
  if (parts.length > 2200) return;
  o.max = o.life; o.dr = o.dr ?? 0.3; o.g = o.g ?? 0; o.rot = o.rot ?? rand(0, 6); o.vr = o.vr ?? rand(-10, 10);
  parts.push(o);
}
function addText(x, y, txt, col, size, life = 1.1) { texts.push({ x, y, txt, col, size, life, max: life, vy: -60 }); }

function fx(x, y, r) {
  const big = r >= 120, onG = y >= GY - 6;
  flashes.push({ x, y, r: r * 1.7, life: 0.2, max: 0.2 });
  rings.push({ x, y, R: r * 1.6, life: 0.5, max: 0.5, w: big ? 12 : 6, c: '255,255,255' });
  rings.push({ x, y, R: r * 0.95, life: 0.32, max: 0.32, w: big ? 8 : 4, c: '255,190,90' });
  const n = Math.min(80, r * 0.55 | 0);
  for (let i = 0; i < n; i++) {
    const a = onG ? rand(-Math.PI, 0) : rand(0, Math.PI * 2), sp = rand(0.15, 1) * r * 4.2;
    addP({ type: 'fire', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.75), s: rand(0.14, 0.34) * r, dr: 0.015, g: -200 });
  }
  for (let i = 0; i < n * 0.6; i++) {
    const a = onG ? rand(-Math.PI, 0) : rand(0, Math.PI * 2), sp = rand(0.1, 0.6) * r * 2;
    const sh = rand(55, 115) | 0;
    addP({ type: 'smoke', x: x + rand(-r, r) * 0.3, y: y + rand(-r, 0) * 0.3, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: rand(1, 2.3), s: rand(0.22, 0.42) * r, dr: 0.12, g: -50, c: `${sh},${sh},${sh + 8}` });
  }
  for (let i = 0; i < 16 + r * 0.12; i++) {
    const a = onG ? rand(-Math.PI * 0.95, -0.05) : rand(0, Math.PI * 2), sp = rand(300, 1000) * (big ? 1.4 : 1);
    addP({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.65), s: 2, dr: 0.25, g: 700 });
  }
  if (onG) {
    for (let i = 0; i < 10 + r * 0.1; i++)
      addP({ type: 'debris', x: x + rand(-10, 10), y: GY - 2, vx: rand(-350, 350), vy: rand(-750, -200), life: rand(1, 2), s: rand(3, 8), dr: 0.7, g: 1500, c: Math.random() < 0.6 ? '#5a3d2b' : '#3f7a3a' });
    decals.push({ x, w: r * 0.9, life: 18 });
    if (decals.length > 40) decals.shift();
  }
  shake = Math.min(32, shake + r * 0.1);
  punch += r * 0.00035;
  flash = Math.min(0.7, flash + (big ? 0.55 : 0.1));
  hitstop = Math.max(hitstop, big ? 0.08 : 0.022);
  sfxBoom(r);
}

// ---------------- 전투 ----------------
function explode(x, y, r, dmg) {
  fx(x, y, r);
  for (const e of enemies) {
    if (e.dead) continue;
    const cy = e.fly ? e.y : e.y + e.jy - e.h / 2;
    const dx = e.x - x, dy = cy - y, d = Math.hypot(dx, dy), reach = r + Math.max(e.w, e.h) / 2;
    if (d < reach) {
      const f = 1 - (d / reach) * 0.55;
      hurt(e, dmg * f, Math.sign(dx || 1), f);
    }
  }
  for (const c of crates) if (!c.dead && Math.hypot(c.x - x, c.y - y) < r + 26) collect(c);
  for (const s of shells) if (!s.dead && Math.hypot(s.x - x, s.y - y) < r + 10) {
    s.dead = true; addScore(50); addText(s.x, s.y - 20, '요격! +50', '#7ff', 26); fx(s.x, s.y, 30);
  }
}
function hurt(e, dmg, dir, f) {
  e.hp -= dmg; e.hit = 0.14;
  const mass = e.type === 'boss' ? 0.12 : e.type === 'tank' ? 0.5 : 1;
  e.kx += dir * 260 * f * mass;
  if (e.fly) e.jy -= 40 * f; else if (e.jy >= 0) e.jv = -380 * f * mass;
  if (e.hp <= 0) kill(e);
  else addText(e.x + rand(-10, 10), (e.fly ? e.y : e.y - e.h) - 10, '-' + Math.ceil(dmg * 10), '#ffd', 18, 0.6);
}
function addScore(v) { score += v; scoreBump = 1; }
function kill(e) {
  e.dead = true; kills++;
  combo++; comboT = 2.6; bestCombo = Math.max(bestCombo, combo);
  const mult = 1 + Math.floor(combo / 5) * 0.5, pts = Math.round(e.sc * mult);
  if (state === 'play') addScore(pts);
  const cy = e.fly ? e.y : e.y - e.h / 2;
  addText(e.x, cy - 30, '+' + pts, mult > 1 ? '#ffcf3a' : '#fff', e.type === 'boss' ? 56 : 30);
  const cols = { soldier: ['#556b2f', '#f1c27d', '#3b4a1f'], tank: ['#6b7b3a', '#333', '#4e5a2a'], drone: ['#445', '#99a', '#f33'], boss: ['#5a2a2a', '#888', '#ff8a2a'] }[e.type];
  const nG = e.type === 'boss' ? 40 : 12;
  for (let i = 0; i < nG; i++)
    addP({ type: 'debris', x: e.x + rand(-e.w, e.w) / 2, y: cy + rand(-e.h, e.h) / 3, vx: rand(-420, 420), vy: rand(-900, -250), life: rand(1.2, 2.4), s: rand(4, e.type === 'tank' || e.type === 'boss' ? 14 : 8), dr: 0.6, g: 1500, c: cols[i % 3] });
  for (let i = 0; i < 14; i++) { const a = rand(0, 7), sp = rand(80, 380); addP({ type: 'fire', x: e.x, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.5), s: rand(10, 22), dr: 0.02, g: -100 }); }
  rings.push({ x: e.x, y: cy, R: 70, life: 0.35, max: 0.35, w: 4, c: '255,240,180' });
  if (e.type === 'boss') {
    slowT = 1.8; addText(W / 2, H * 0.35, 'BOSS DOWN!', '#ff5a3a', 84, 2.2);
    for (let i = 0; i < 8; i++) timers.push({ t: i * 0.14, f: () => fx(e.x + rand(-70, 70), e.y - rand(20, 150), rand(60, 110)) });
    timers.push({ t: 1.2, f: () => explode(e.x, e.y - 60, 230, 6) });
    ammo[2] += 2; addText(e.x, e.y - 200, '+2 메가폭탄', '#ff8080', 30, 1.8);
  }
  if (combo > 0 && combo % 5 === 0) {
    slowT = Math.max(slowT, 0.7);
    addText(W / 2, H * 0.28, combo + ' COMBO!', '#ffcf3a', 64, 1.4);
    sfxTone(400, 1600, 0.4, 'square', 0.12);
  }
  if (state === 'play' && Math.random() < 0.07) spawnCrate(clamp(e.x, W * 0.3, W * 0.9));
}
function hitBase(d) {
  if (state !== 'play') return;
  hp = Math.max(0, hp - d); hpShake = 1; redFlash = 0.6; cannon.squash = 1;
  shake = Math.min(32, shake + 12); combo = 0; sfxHurt();
  if (hp <= 0) gameOver();
}
function collect(c) {
  c.dead = true; sfxPop();
  rings.push({ x: c.x, y: c.y, R: 90, life: 0.5, max: 0.5, w: 6, c: '120,255,200' });
  for (let i = 0; i < 24; i++) { const a = rand(0, 7), sp = rand(150, 500); addP({ type: 'spark', x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.7), s: 2, dr: 0.2, g: 300, hue: 1 }); }
  if (c.kind === 'cluster') { ammo[1] += 3; slotBump[1] = 1; addText(c.x, c.y - 30, '+3 클러스터', '#6f6', 30); }
  else if (c.kind === 'mega') { ammo[2] += 1; slotBump[2] = 1; addText(c.x, c.y - 30, '+1 메가폭탄', '#ff7070', 30); }
  else { hp = Math.min(100, hp + 25); addText(c.x, c.y - 30, '+25 HP', '#7cf', 30); }
}
function spawnCrate(x) {
  const r = Math.random();
  crates.push({ x0: x, x, y: -40, kind: r < 0.45 ? 'cluster' : r < 0.75 ? 'mega' : 'heal', ph: rand(0, 6), landed: false, life: 7 });
}
function spawnEnemy(type) {
  const d = ED[type], hpm = 1 + Math.max(0, wave - 1) * 0.12;
  const e = { type, x: W + 60 + rand(0, 40), y: GY, baseY: GY - rand(140, Math.min(320, GY * 0.6)), w: d.w, h: d.h, sp: d.sp * rand(0.85, 1.15) * spdScale, hp: d.hp * hpm, max: d.hp * hpm, sc: d.sc, dmg: d.dmg, fire: d.fire || 0, fireT: rand(1, 3), fly: !!d.fly, anim: rand(0, 9), hit: 0, kx: 0, jy: 0, jv: 0, sq: 0, rc: 0, ph: rand(0, 6), age: 0 };
  if (e.fly) e.y = e.baseY;
  if (type === 'boss') { e.sp = d.sp * spdScale; shake = 20; addText(W * 0.75, H * 0.4, '⚠ 거대 메카 접근! ⚠', '#ff4a4a', 44, 2); }
  enemies.push(e);
}
function fire(auto) {
  if (ammo[weapon] <= 0) weapon = 0;
  const w = WEAP[weapon], p = 0.25 + cannon.charge * 0.75, sp = lerp(380, 1250, p) * sScale, a = cannon.ang;
  const px = cannon.x, py = cannon.y - 34, tx = px + Math.cos(a) * 64, ty = py + Math.sin(a) * 64;
  bombs.push({ x: tx, y: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, type: weapon, child: false, rot: 0, vr: rand(-9, 9), r: w.size, trail: 0, age: 0 });
  if (ammo[weapon] !== Infinity) { ammo[weapon]--; slotBump[weapon] = 1; if (ammo[weapon] <= 0) weapon = 0; }
  cannon.recoil = 1; cannon.squash = 0.6;
  shake = Math.min(32, shake + 4 + p * 4 + (w === WEAP[2] ? 8 : 0));
  flashes.push({ x: tx, y: ty, r: 70 + p * 40, life: 0.12, max: 0.12 });
  for (let i = 0; i < 18; i++) { const aa = a + rand(-0.35, 0.35), s = rand(150, 650); addP({ type: 'fire', x: tx, y: ty, vx: Math.cos(aa) * s, vy: Math.sin(aa) * s, life: rand(0.12, 0.3), s: rand(8, 18), dr: 0.01, g: 0 }); }
  for (let i = 0; i < 12; i++) { const aa = a + rand(-0.8, 0.8), s = rand(40, 260); addP({ type: 'smoke', x: tx, y: ty, vx: Math.cos(aa) * s, vy: Math.sin(aa) * s, life: rand(0.8, 1.6), s: rand(12, 26), dr: 0.08, g: -60, c: '210,210,215' }); }
  rings.push({ x: tx, y: ty, R: 45, life: 0.25, max: 0.25, w: 4, c: '255,255,255' });
  if (!auto) cannon.charge = 0;
  sfxFire(p);
}
function selectWeapon(i) {
  if (ammo[i] > 0) { weapon = i; slotBump[i] = 1; sfxClick(); }
  else { slotDeny[i] = 1; sfxTone(150, 100, 0.12, 'square', 0.1); }
}

// ---------------- 웨이브 ----------------
function startWave() {
  wave++; bannerT = 0; waveState = 'banner';
  palFrom = palTo; palTo = Math.floor((wave - 1) / 2) % PAL.length; palK = palFrom === palTo ? 1 : 0;
  spawnList = [];
  const n = 5 + wave * 3;
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    let tp = 'soldier';
    if (wave >= 2 && r < 0.18 + wave * 0.02) tp = 'tank';
    else if (wave >= 3 && r > 0.72 - wave * 0.015) tp = 'drone';
    spawnList.push(tp);
  }
  if (wave % 5 === 0) spawnList.push('boss');
  spawnT = 0.5;
}
function startGame() {
  enemies = []; bombs = []; shells = []; crates = []; timers = []; texts = [];
  score = 0; shownScore = 0; hp = 100; hpLag = 100; wave = 0; combo = 0; bestCombo = 0; kills = 0;
  ammo = [Infinity, 3, 1]; weapon = 0; crateT = 9; cannon.charge = 0; cannon.charging = false;
  state = 'play'; palTo = 0; startWave();
}
function gameOver() {
  state = 'over'; overT = 0; slowT = 2;
  cannon.charging = false;
  for (let i = 0; i < 7; i++) timers.push({ t: i * 0.16, f: () => fx(cannon.x + rand(-80, 60), GY - rand(0, 80), rand(70, 130)) });
  if (score > best) { best = score; try { localStorage.setItem('cannonBest', best); } catch (e) { } }
}

// ---------------- 업데이트 ----------------
function update(rdt) {
  t += rdt;
  if (slowT > 0) { slowT -= rdt; timeScale = lerp(timeScale, 0.22, 0.25); } else timeScale = lerp(timeScale, 1, 0.08);
  shake *= Math.pow(0.004, rdt); punch *= Math.pow(0.001, rdt);
  flash *= Math.pow(0.0005, rdt); redFlash *= Math.pow(0.02, rdt);
  hpShake *= Math.pow(0.01, rdt);
  scoreBump *= Math.pow(0.005, rdt);
  for (let i = 0; i < 3; i++) { slotBump[i] *= Math.pow(0.01, rdt); slotDeny[i] *= Math.pow(0.01, rdt); }
  shownScore = lerp(shownScore, score, 1 - Math.pow(0.0001, rdt)); if (Math.abs(shownScore - score) < 1) shownScore = score;
  hpLag = hpLag > hp ? Math.max(hp, hpLag - rdt * 30) : hp;
  if (palK < 1) palK = Math.min(1, palK + rdt * 0.4);

  // 조준
  const px = cannon.x, py = cannon.y - 34;
  if (state === 'play') {
    const target = clamp(Math.atan2(mouse.y - py, mouse.x - px), -1.5, -0.04);
    cannon.ang = lerp(cannon.ang, target, 1 - Math.pow(0.0000001, rdt));

  ctx.save(); ctx.translate(W / 2, y); ctx.rotate(Math.sin(t * 2) * 0.02);
  outlined('GAME OVER', 0, 0, Math.min(100, W * 0.13), '#ff4a3a', 'center', 10);
  outlined(`점수 ${score.toLocaleString()}   ·   웨이브 ${wave}   ·   최고 콤보 ${bestCombo}   ·   격파 ${kills}`, 0, 50, Math.min(22, W * 0.035), '#fff', 'center', 4);
  if (score >= best && score > 0) outlined('★ 신기록! ★', 0, 86, 26, '#ffd23a', 'center', 4);
  if (overT > 1.5) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5); outlined('클릭해서 다시 시작', 0, 130, 24, '#fff', 'center', 4); }
  ctx.restore(); ctx.globalAlpha = 1;
}

// ---------------- 렌더 ----------------
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = (Math.random() - 0.5) * shake * 2, sy = (Math.random() - 0.5) * shake * 2;
  drawSky();
  ctx.save(); ctx.translate(sx * 0.3, sy * 0.3); drawMountains(Math.sin(t * 0.1) * 20); ctx.restore();
  ctx.save();
  const z = 1 + Math.min(0.08, punch) + (1 - timeScale) * 0.04;
  ctx.translate(W / 2, H * 0.6); ctx.scale(z, z); ctx.translate(-W / 2 + sx, -H * 0.6 + sy);
  drawGround();
  drawBase();
  if (state === 'play') drawPreview();
  for (const c of crates) drawCrate(c);
  for (const e of enemies) drawEnemy(e);
  if (state !== 'over' || overT < 0.6) drawCannon();
  for (const s of shells) drawShell(s);
  for (const b of bombs) drawBomb(b);
  drawParticles();
  drawTexts();
  ctx.restore();

  // 슬로우모션 집중선
  if (timeScale < 0.8) {
    const k = (0.8 - timeScale) / 0.6;
    ctx.strokeStyle = `rgba(255,255,255,${0.18 * k})`; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 40; i++) {
      const a = i / 40 * Math.PI * 2 + t * 0.5, r1 = Math.max(W, H) * (0.45 + Math.random() * 0.1), r2 = Math.max(W, H) * 0.8;
      ctx.moveTo(W / 2 + Math.cos(a) * r1, H / 2 + Math.sin(a) * r1); ctx.lineTo(W / 2 + Math.cos(a) * r2, H / 2 + Math.sin(a) * r2);
    }
    ctx.stroke();
  }
  // 플래시
  if (flash > 0.01) { ctx.fillStyle = `rgba(255,245,220,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  const lowHp = state === 'play' && hp < 30 ? (0.25 + 0.2 * Math.sin(t * 6)) : 0;
  const red = Math.max(redFlash, lowHp);
  // 비네트
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, red > 0.02 ? `rgba(200,0,0,${0.3 + red * 0.6})` : 'rgba(0,0,20,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (state === 'play' || state === 'over') { drawHUD(); drawBanner(); }
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
}

// ---------------- 입력 ----------------
function setMouse(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
cv.addEventListener('pointerdown', e => {
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  setMouse(e);
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.5) startGame(); return; }
  for (let i = 0; i < 3; i++) { const s = slots[i]; if (mouse.x > s.x && mouse.x < s.x + s.w && mouse.y > s.y - 10 && mouse.y < s.y + s.h) { selectWeapon(i); return; } }
  cannon.charging = true; cannon.charge = 0;
});
cv.addEventListener('pointermove', setMouse);
addEventListener('pointerup', e => { if (cannon.charging && state === 'play') { cannon.charging = false; fire(false); } });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === '1' || e.key === '2' || e.key === '3') selectWeapon(+e.key - 1);
  if (e.code === 'Space' && !e.repeat && !cannon.charging) { initAudio(); cannon.charging = true; cannon.charge = 0; e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.code === 'Space' && cannon.charging && state === 'play') { cannon.charging = false; fire(false); } });
cv.addEventListener('wheel', e => { if (state === 'play') { let i = weapon; for (let n = 0; n < 3; n++) { i = (i + (e.deltaY > 0 ? 1 : 2)) % 3; if (ammo[i] > 0) break; } selectWeapon(i); } }, { passive: true });

// ---------------- 루프 ----------------
resize();
let last = performance.now();
function loop(now) {
  const rdt = Math.min(0.033, (now - last) / 1000); last = now;
  update(rdt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
